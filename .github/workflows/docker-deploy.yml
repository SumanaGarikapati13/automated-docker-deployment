name: Automated Docker Container Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Stop existing container
        run: docker stop automated-docker-container || exit 0

      - name: Remove existing container
        run: docker rm automated-docker-container || exit 0

      - name: Build Docker image
        run: docker build -t automated-docker-app .

      - name: Run new container
        run: docker run -d -p 5000:5000 --name automated-docker-container automated-docker-app